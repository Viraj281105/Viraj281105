<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711" />
      <stop offset="50%" stop-color="#0c0b1e" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>

    <!-- Hologram Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Hologram Purple Glow -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid { stroke: #1e1b4b; stroke-width: 0.5; opacity: 0.4; }
    .grid-highlight { stroke: #818cf8; stroke-width: 1; opacity: 0.15; }
    .neon-cyan { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glowCyan); }
    .neon-purple { stroke: #a855f7; stroke-width: 1.5; filter: url(#glowPurple); }
    .neon-dim { stroke: #00f0ff; stroke-width: 1; opacity: 0.3; }
    .text-title { font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 42px; fill: #ffffff; letter-spacing: 6px; }
    .text-subtitle { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #00f0ff; letter-spacing: 4px; opacity: 0.9; }
    .text-telemetry { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #6366f1; letter-spacing: 1px; }
    
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.95; }
      100% { opacity: 0.3; }
    }
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); }
      50% { transform: translateY(280px); }
      100% { transform: translateY(0px); }
    }
    @keyframes flicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 0.99; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
    }

    .anim-pulse { animation: pulse 3s infinite; }
    .anim-rotate-cw { transform-origin: 850px 140px; animation: rotateCW 20s linear infinite; }
    .anim-rotate-ccw { transform-origin: 850px 140px; animation: rotateCCW 12s linear infinite; }
    .anim-flicker { animation: flicker 4s infinite; }
    .anim-scan-line { animation: scan 8s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g>
    <path d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240" class="grid" />
    <path d="M 100,0 L 100,280 M 200,0 L 200,280 M 300,0 L 300,280 M 400,0 L 400,280 M 500,0 L 500,280 M 600,0 L 600,280 M 700,0 L 700,280 M 800,0 L 800,280 M 900,0 L 900,280" class="grid" />
    <!-- Diagonal futuristic tech accent lines -->
    <line x1="0" y1="0" x2="150" y2="150" class="grid-highlight" />
    <line x1="1000" y1="0" x2="850" y2="150" class="grid-highlight" />
  </g>

  <!-- Animated Scanning line -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#00f0ff" stroke-width="0.7" opacity="0.3" class="anim-scan-line" />

  <!-- Left HUD Panel & Borders -->
  <g class="anim-flicker">
    <!-- Top bracket -->
    <path d="M 30,20 L 70,20 M 30,20 L 30,50" class="neon-cyan" fill="none" />
    <!-- Bottom bracket -->
    <path d="M 30,260 L 70,260 M 30,260 L 30,230" class="neon-cyan" fill="none" />
    <!-- Right bracket border -->
    <path d="M 970,20 L 930,20 M 970,20 L 970,50" class="neon-cyan" fill="none" />
    <path d="M 970,260 L 930,260 M 970,260 L 970,230" class="neon-cyan" fill="none" />
  </g>

  <!-- Horizontal Tech Divider Bars -->
  <line x1="50" y1="35" x2="950" y2="35" class="neon-dim" />
  <line x1="50" y1="245" x2="950" y2="245" class="neon-dim" />

  <!-- Main System Title Info -->
  <g transform="translate(80, 110)">
    <!-- Tech node indicator -->
    <rect x="-20" y="-30" width="8" height="35" fill="#00f0ff" class="anim-pulse" />
    
    <text x="0" y="0" class="text-title anim-flicker">VIRAJ JADHAO</text>
    <text x="5" y="32" class="text-subtitle">[ COGNITIVE ARCHITECT &amp; SYSTEMS ENGINEER ]</text>
    
    <!-- Sub-status nodes -->
    <g transform="translate(5, 65)">
      <circle cx="0" cy="0" r="3" fill="#a855f7" />
      <text x="12" y="4" class="text-telemetry">SYS.LOC: SAVITRIBAI PHULE SPPU</text>
      
      <circle cx="280" cy="0" r="3" fill="#00f0ff" />
      <text x="292" y="4" class="text-telemetry">MEM.ALLOC: 9.368 CGPA</text>
      
      <circle cx="500" cy="0" r="3" fill="#00f0ff" />
      <text x="512" y="4" class="text-telemetry">CORE: CAUSAL AI // AGENT NETWORKS</text>
    </g>
  </g>

  <!-- Diagnostics Ring (Right Hand Side) -->
  <g class="anim-flicker">
    <!-- Outer solid diagnostic circle -->
    <circle cx="850" cy="140" r="90" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="10 40 50 10 5 15" class="anim-rotate-cw" />
    <circle cx="850" cy="140" r="80" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="100 20 40 20" class="anim-rotate-ccw" />
    <circle cx="850" cy="140" r="68" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-dasharray="2 4" />
    
    <!-- Inner Target Reticle -->
    <path d="M 850,115 L 850,125 M 850,155 L 850,165 M 825,140 L 835,140 M 865,140 L 875,140" stroke="#00f0ff" stroke-width="1.5" fill="none" />
    <circle cx="850" cy="140" r="10" fill="none" stroke="#00f0ff" stroke-width="1" class="anim-pulse" />
    
    <!-- Telemetry Marks -->
    <text x="815" y="40" class="text-telemetry" fill="#00f0ff">SYS_ACTIVE: 99.82%</text>
    <text x="815" y="235" class="text-telemetry" fill="#a855f7">RETICLE_CALIBRATED</text>
  </g>

  <!-- Decorative Telemetry Data Left Side -->
  <g transform="translate(80, 215)" class="text-telemetry" fill="#52525b">
    <text x="0" y="0">STARK_NET_ADDR: //V28.11.05.SEC_ALPHA</text>
    <text x="0" y="12">CAUSALITY_INDEX_EST: ATE_94.82%_CONF</text>
  </g>
</svg>
