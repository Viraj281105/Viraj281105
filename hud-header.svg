<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient (Deep Space Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Electric Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Indigo Accent Glow -->
    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid { stroke: #1f2937; stroke-width: 0.5; opacity: 0.35; }
    .grid-heavy { stroke: #374151; stroke-width: 0.8; opacity: 0.2; }
    .cyan-glow { stroke: #00f5ff; stroke-width: 1.5; filter: url(#glowCyan); }
    .indigo-glow { stroke: #6366f1; stroke-width: 1.2; filter: url(#glowIndigo); opacity: 0.8; }
    .tech-line { stroke: #1f2937; stroke-width: 1; }
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: 12px; }
    .text-subtitle { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #00f5ff; letter-spacing: 5px; font-weight: bold; }
    .text-telemetry { font-family: 'Courier New', Courier, monospace; font-size: 9.5px; fill: #9ca3af; letter-spacing: 1.5px; }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(280px); opacity: 0.1; }
    }
    @keyframes flicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 0.99; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.3; }
    }

    .anim-pulse { animation: pulse 2.5s infinite ease-in-out; }
    .anim-rotate-cw { transform-origin: 860px 140px; animation: rotateCW 40s linear infinite; }
    .anim-rotate-ccw { transform-origin: 860px 140px; animation: rotateCCW 25s linear infinite; }
    .anim-flicker { animation: flicker 7s infinite; }
    .anim-scan-line { animation: scan 8s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#bgGrad)" />

  <!-- Fine Schematic Grid -->
  <g>
    <!-- Verticals -->
    <path d="M 50,0 L 50,280 M 150,0 L 150,280 M 250,0 L 250,280 M 350,0 L 350,280 M 450,0 L 450,280 M 550,0 L 550,280 M 650,0 L 650,280 M 750,0 L 750,280 M 850,0 L 850,280 M 950,0 L 950,280" class="grid" />
    <!-- Horizontals -->
    <path d="M 0,40 L 1000,40 M 0,80 L 1000,80 M 0,120 L 1000,120 M 0,160 L 1000,160 M 0,200 L 1000,200 M 0,240 L 1000,240" class="grid" />
    
    <!-- Heavy Accent lines -->
    <line x1="50" y1="40" x2="950" y2="40" class="grid-heavy" />
    <line x1="50" y1="240" x2="950" y2="240" class="grid-heavy" />
  </g>

  <!-- Laser Scan Beam -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#00f5ff" stroke-width="1" class="anim-scan-line" />

  <!-- Clean Minimalist Corner Brackets -->
  <g class="anim-flicker">
    <!-- Top-Left -->
    <path d="M 30,20 L 70,20 M 30,20 L 30,60" fill="none" class="cyan-glow" />
    <!-- Bottom-Left -->
    <path d="M 30,260 L 70,260 M 30,260 L 30,220" fill="none" class="cyan-glow" />
    <!-- Top-Right -->
    <path d="M 970,20 L 930,20 M 970,20 L 970,60" fill="none" class="cyan-glow" />
    <!-- Bottom-Right -->
    <path d="M 970,260 L 930,260 M 970,260 L 970,220" fill="none" class="cyan-glow" />
  </g>

  <!-- Technical Node Accents -->
  <g class="anim-flicker" opacity="0.6">
    <!-- Top Bar Telemetry -->
    <line x1="120" y1="20" x2="400" y2="20" class="tech-line" />
    <circle cx="120" cy="20" r="2.5" fill="#00f5ff" />
    <circle cx="400" cy="20" r="1.5" fill="#6366f1" />

    <!-- Bottom Bar Telemetry -->
    <line x1="600" y1="260" x2="880" y2="260" class="tech-line" />
    <circle cx="600" cy="260" r="1.5" fill="#6366f1" />
    <circle cx="880" cy="260" r="2.5" fill="#00f5ff" />
  </g>

  <!-- Main Center Title & Branding -->
  <g transform="translate(85, 115)">
    <!-- Vertical Branding Bars -->
    <rect x="-25" y="-30" width="4" height="50" fill="#00f5ff" />
    <rect x="-25" y="25" width="4" height="20" fill="#6366f1" />
    <rect x="-25" y="50" width="4" height="10" fill="#1f2937" />

    <text x="0" y="5" class="text-title anim-flicker">VIRAJ JADHAO</text>
    <text x="3" y="32" class="text-subtitle">[ CAUSAL AI &amp; SYSTEMS ENGINEER ]</text>
    
    <!-- Dynamic State Telemetry Rows -->
    <g transform="translate(3, 62)">
      <circle cx="0" cy="0" r="3" fill="#6366f1" />
      <text x="12" y="3" class="text-telemetry">SYS_NODE: ASIA_KOLKATA</text>
      
      <circle cx="270" cy="0" r="3" fill="#00f5ff" />
      <text x="282" y="3" class="text-telemetry">MEM_CGPA: 9.368_ALLOC</text>
      
      <circle cx="530" cy="0" r="3" fill="#10b981" class="anim-pulse" />
      <text x="542" y="3" class="text-telemetry">CAUSAL_SCM: ONLINE // ACTIVE</text>
    </g>
  </g>

  <!-- Diagnostic Holographic Ring (Right Side Alignment) -->
  <g class="anim-flicker">
    <!-- Concentric Technical Rotators -->
    <circle cx="860" cy="140" r="82" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-dasharray="20 40 60 10" class="anim-rotate-cw" />
    <circle cx="860" cy="140" r="72" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="140 40" class="anim-rotate-ccw" />
    <circle cx="860" cy="140" r="60" fill="none" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2 8" />
    
    <!-- Core Crosshairs -->
    <path d="M 860,118 L 860,126 M 860,154 L 860,162 M 838,140 L 846,140 M 874,140 L 882,140" stroke="#00f5ff" stroke-width="1.5" fill="none" />
    <circle cx="860" cy="140" r="6" fill="none" stroke="#10b981" stroke-width="1" class="anim-pulse" />
    
    <!-- Lateral Metrics text -->
    <text x="815" y="44" class="text-telemetry" fill="#00f5ff">INTEGRITY_100%</text>
    <text x="815" y="234" class="text-telemetry" fill="#6366f1">DECOUPLED_SYNC</text>
  </g>

  <!-- Calibration Info Panel (Left Bottom) -->
  <g transform="translate(85, 218)" class="text-telemetry" fill="#4b5563">
    <text x="0" y="0">CORE: //TRANS.GATEWAY.V28.11.05</text>
    <text x="0" y="10">KERNEL: IPW_DOUBLY_ROBUST_STABLE</text>
  </g>
</svg>
