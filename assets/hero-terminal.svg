<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto" style="border-radius: 8px; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;">
  <style>
    .terminal-bg { fill: #070913; stroke: #1e1b4b; stroke-width: 1.5; }
    .title-bar { fill: #0f1123; }
    .dot { rx: 6; ry: 6; }
    .dot-red { fill: #ef4444; }
    .dot-yellow { fill: #f59e0b; }
    .dot-green { fill: #10b981; }
    .title-text { fill: #6366f1; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
    .terminal-text { font-size: 13px; font-weight: 500; }
    .cyan-txt { fill: #00f5ff; }
    .purple-txt { fill: #a855f7; }
    .emerald-txt { fill: #10b981; }
    .slate-txt { fill: #94a3b8; }
    .indigo-txt { fill: #818cf8; }
    
    .cursor {
      fill: #00f5ff;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { fill: transparent; }
    }
    
    .typing-1 {
      overflow: hidden;
      white-space: nowrap;
      animation: type1 1.5s steps(30, end) forwards;
    }
    .typing-2 {
      opacity: 0;
      animation: fadeIn 0.2s ease 1.5s forwards;
    }
    .typing-3 {
      opacity: 0;
      animation: fadeIn 0.2s ease 2.2s forwards;
    }
    .typing-4 {
      opacity: 0;
      animation: fadeIn 0.2s ease 2.9s forwards;
    }
    .typing-5 {
      opacity: 0;
      animation: fadeIn 0.2s ease 3.6s forwards;
    }
    
    @keyframes type1 {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <defs>
    <!-- Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main window -->
  <rect class="terminal-bg" width="848" height="258" x="1" y="1" rx="8" />
  
  <!-- Title bar -->
  <path class="title-bar" d="M 1 9 A 8 8 0 0 1 9 1 L 841 1 A 8 8 0 0 1 849 9 L 849 32 L 1 32 Z" />
  
  <!-- Window Controls -->
  <circle class="dot dot-red" cx="20" cy="16" r="6" />
  <circle class="dot dot-yellow" cx="40" cy="16" r="6" />
  <circle class="dot dot-green" cx="60" cy="16" r="6" />
  
  <!-- Title Text -->
  <text class="title-text" x="425" y="20" text-anchor="middle">MISSION-CONTROL // VIRAJ-SYS-OS.V2811.05</text>
  <line x1="1" y1="32" x2="849" y2="32" stroke="#1e1b4b" stroke-width="1" />

  <!-- Terminal Content -->
  <g transform="translate(25, 60)">
    <!-- Line 1: Ingesting prompt command -->
    <g class="typing-1">
      <text class="terminal-text" x="0" y="0">
        <tspan class="cyan-txt">guest@viraj-node-01</tspan><tspan class="slate-txt">:</tspan><tspan class="purple-txt">~</tspan><tspan class="slate-txt">$</tspan>
        <tspan fill="#ffffff" font-weight="bold"> ./init_session --profile=viraj-jadhao --role=ai-systems-engineer</tspan>
      </text>
    </g>

    <!-- Line 2: Response status -->
    <g class="typing-2">
      <text class="terminal-text" x="0" y="25">
        <tspan class="slate-txt">[</tspan><tspan class="emerald-txt"> OK </tspan><tspan class="slate-txt">]</tspan>
        <tspan class="indigo-txt"> Host Node:</tspan><tspan fill="#ffffff"> SPPU Host Cluster (Pune, India)</tspan>
        <tspan class="slate-txt"> | Latency:</tspan><tspan class="emerald-txt"> 0.81ms</tspan>
      </text>
    </g>

    <!-- Line 3: Core Neural Fabric status -->
    <g class="typing-3">
      <text class="terminal-text" x="0" y="50">
        <tspan class="slate-txt">[</tspan><tspan class="emerald-txt"> OK </tspan><tspan class="slate-txt">]</tspan>
        <tspan class="indigo-txt"> Neural Fabric:</tspan><tspan fill="#ffffff"> LangGraph Orchestrator &amp; Agentic Router (3 nodes online)</tspan>
      </text>
    </g>

    <!-- Line 4: Memory & Storage -->
    <g class="typing-4">
      <text class="terminal-text" x="0" y="75">
        <tspan class="slate-txt">[</tspan><tspan class="emerald-txt"> OK </tspan><tspan class="slate-txt">]</tspan>
        <tspan class="indigo-txt"> Datastore Mesh:</tspan><tspan fill="#ffffff"> PostgreSQL (pgvector/HNSW indices) &amp; Redis Cache synced</tspan>
      </text>
    </g>

    <!-- Line 5: System parameters display -->
    <g class="typing-5">
      <text class="terminal-text" x="0" y="105" fill="#ffffff" font-weight="bold">> LOADING PROFILE DETAILS...</text>
      
      <text class="terminal-text" x="20" y="130">
        <tspan class="purple-txt">■</tspan> <tspan class="indigo-txt">Specialization :</tspan> <tspan fill="#ffffff">Multi-Agent Orchestration • Causal AI • High-Throughput APIs</tspan>
      </text>
      <text class="terminal-text" x="20" y="150">
        <tspan class="purple-txt">■</tspan> <tspan class="indigo-txt">Active Focus   :</tspan> <tspan fill="#ffffff">Stateful Agent Reasoning Engines • Structural Causal Models</tspan>
      </text>
      <text class="terminal-text" x="20" y="170">
        <tspan class="purple-txt">■</tspan> <tspan class="indigo-txt">Capabilities   :</tspan> <tspan fill="#ffffff">LangGraph • FastAPI • Spring Boot • React/Next.js • pgvector</tspan>
      </text>
      
      <!-- Blinking cursor -->
      <rect class="cursor" x="655" y="157" width="8" height="15" />
    </g>
  </g>
</svg>
