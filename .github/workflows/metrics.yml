# Generate Metrics
# NOTE: This workflow requires a GitHub personal access token stored in the repository secrets as METRICS_TOKEN.
# You must create this secret under Settings -> Secrets and variables -> Actions -> New repository secret.

name: Generate Metrics

on:
  schedule:
    # Run once a day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate base metrics
        uses: lowlighter/metrics@v3.26
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Viraj281105
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          output_action: none

      - name: Generate language distribution metrics
        uses: lowlighter/metrics@v3.26
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Viraj281105
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex
          config_timezone: Asia/Kolkata
          output_action: none

      - name: Generate achievements matrix
        uses: lowlighter/metrics@v3.26
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Viraj281105
          filename: github-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8
          plugin_achievements_display: compact
          config_timezone: Asia/Kolkata
          output_action: none

      - name: Generate recent activity stream
        uses: lowlighter/metrics@v3.26
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Viraj281105
          filename: github-activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          config_timezone: Asia/Kolkata
          output_action: none

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add github-metrics.svg github-languages.svg github-achievements.svg github-activity.svg
          if git diff --cached --quiet; then
            echo "No changes in generated metrics. Skipping commit."
          else
            git commit -m "chore: update GitHub metrics SVGs"
            git push
          fi
